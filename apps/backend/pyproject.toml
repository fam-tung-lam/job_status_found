[project]
name = "job-status-found"
version = "0.1.0"
description = "Backend API for job_status_found"
readme = "README.md"
authors = [
    { name = "Pham Tung Lam", email = "fam.tung.lam@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "aiosmtplib>=5.1.3",
    "alembic>=1.20.0",
    "fastapi>=0.141.1",
    "psycopg[binary]>=3.3.6",
    "pwdlib[argon2]>=0.3.1",
    "pydantic-settings>=2.15.0",
    "pydantic[email]>=2.13.5",
    "sqlalchemy[asyncio]>=2.0.54",
    "uvicorn[standard]>=0.53.0",
]

[build-system]
requires = ["uv_build>=0.10.7,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx2>=2.13.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "pytest-mock>=3.15.1",
    "ruff>=0.16.8",
    "ty==0.0.82",
]

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "N", "UP", "B", "A", "C4", "SIM", "RET", "PTH",
    "ASYNC", "S", "BLE", "FBT", "DTZ", "T20", "PT", "PL", "RUF", "FAST", "D",
    # Preview docstring rules, selected by exact code (see explicit-preview-rules).
    "D420", "D421",
    "DOC102", "DOC201", "DOC202", "DOC402", "DOC403", "DOC501", "DOC502",
]
preview = true
explicit-preview-rules = true
# N818: the root AGENTS.md names failures `<Operation>Failure`, not `...Error`.
ignore = ["PLR2004", "N818"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# Tests assert, pass literal passwords, and parametrize boolean expectations.
# Their private helpers carry one-line docstrings without `Args:` sections.
"tests/**" = ["S101", "D", "DOC", "S105", "S106", "S107", "FBT001"]
# A use case takes each collaborator as its own keyword argument, and its `di.py`
# provider injects each one as its own `Depends` parameter (backend AGENTS.md).
"src/job_status_found/features/*/application/use_cases/*.py" = ["PLR0913"]
"src/job_status_found/features/*/di.py" = ["PLR0913", "PLR0917"]

[tool.ruff.format]
docstring-code-format = true

[tool.ty.environment]
python-version = "3.14"

[tool.ty.rules]
all = "error"

[tool.pytest]
testpaths = ["tests"]
# `importlib` lets a unit and an integration test of one module share a file name.
addopts = ["--strict-markers", "--strict-config", "-ra", "--import-mode=importlib"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
asyncio_default_test_loop_scope = "function"

[tool.coverage.run]
source = ["job_status_found"]
branch = true
omit = ["src/job_status_found/main.py"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true
