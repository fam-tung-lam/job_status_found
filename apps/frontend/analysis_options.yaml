include: package:very_good_analysis/analysis_options.yaml

formatter:
  trailing_commas: automate

analyzer:
  exclude:
    - build/**
    - android/**
    - ios/**
    - web/**

linter:
  rules:
    # Not in very_good_analysis 11.0.0. Prefer Dart 3.13 primary constructors,
    # declared in the class header, and declare each field as a primary
    # constructor parameter instead of a separate field and `this.` parameter.
    use_primary_constructors: true
    use_declaring_parameters: true
